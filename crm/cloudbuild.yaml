# Cloud Build: build the image, push to Artifact Registry, deploy to Cloud Run.
#
# Two triggers use this file (see README "Continuous deploys"):
#   production: push to main,    included files crm/**, _SERVICE=ecolens-crm
#   staging:    push to staging, included files crm/**, _SERVICE=ecolens-crm-staging
# Env vars and secrets already set on the service are kept by `gcloud run deploy`.
# Manual run:  gcloud builds submit --config crm/cloudbuild.yaml --substitutions=_SQL_INSTANCE=... .
substitutions:
  _REGION: us-central1
  _SERVICE: ecolens-crm
  _REPO: apps
  _SQL_INSTANCE: ''
steps:
  - name: bash
    id: stamp
    dir: crm
    script: |
      #!/usr/bin/env bash
      echo "${SHORT_SHA:-manual}" > VERSION
      echo "building commit $(cat VERSION) for ${_SERVICE}"
    env: ['SHORT_SHA=$SHORT_SHA', '_SERVICE=${_SERVICE}']
  - name: gcr.io/cloud-builders/docker
    id: build
    dir: crm
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .
  - name: gcr.io/cloud-builders/docker
    id: push
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --quiet
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
options:
  logging: CLOUD_LOGGING_ONLY
