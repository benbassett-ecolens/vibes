# Runs the deal desk on live market data and writes a readable report into the
# repo. No terminal needed: open the Actions tab, pick "Run deal desk", press
# the green button. The form fields below become the desk's settings.
name: Run deal desk

on:
  workflow_dispatch:
    inputs:
      account_size:
        description: "Account size in dollars (position sizes are scaled to this)"
        required: false
        default: "100000"
      max_price:
        description: "Highest share price to consider"
        required: false
        default: "25"
      min_pe:
        description: "Lowest P/E to consider (this screen wants HIGH P/E)"
        required: false
        default: "25"
      require_dividend:
        description: "Only consider companies that pay a dividend"
        type: boolean
        required: false
        default: false
      max_candidates:
        description: "How many names to pull from the screener"
        required: false
        default: "40"
  schedule:
    # 9:00am Central on weekdays. GitHub Actions cron is fixed UTC and does not
    # know about Daylight Saving, so this is two rules rather than one: one
    # tuned for Central Daylight Time (UTC-5, roughly March-October) and one
    # for Central Standard Time (UTC-6, roughly November-February). Each is
    # only off by an hour, if at all, in the few days right around the clock
    # change in March/November -- not worth a third rule to fix.
    #
    # The Nov-Feb rule spells out the months as a list (11,12,1,2) rather than
    # a range (11-2): a previous version used "11-2" and GitHub Actions
    # silently rejected the whole workflow file as invalid, because a cron
    # range must count up (low-high), and a month range that wraps past
    # December back to January isn't one. Every scheduled and manual run
    # failed with zero jobs until this was caught.
    - cron: "0 14 * 3-10 1-5"      # 9am CDT, March through October
    - cron: "0 15 * 11,12,1,2 1-5" # 9am CST, November through February

permissions:
  contents: write

# Only one run pushes to main at a time. This does not by itself fix a stale
# rerun (see the retry loop below) but it stops two genuinely-concurrent runs
# -- a manual click landing next to a scheduled fire, say -- from racing each
# other in the first place. cancel-in-progress is false because a queued run
# should still get its own report, not be thrown away.
concurrency:
  group: deal-desk-main-push
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[live]"

      - name: Run the desk
        id: desk
        # Never fail the job here. If Yahoo blocks the runner we still want the
        # log and a report saying so, rather than a red X with nothing to read.
        continue-on-error: true
        env:
          ACCOUNT: ${{ github.event.inputs.account_size || '100000' }}
          MAX_PRICE: ${{ github.event.inputs.max_price || '25' }}
          MIN_PE: ${{ github.event.inputs.min_pe || '25' }}
          MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '40' }}
          REQUIRE_DIVIDEND: ${{ github.event.inputs.require_dividend }}
        run: |
          set -o pipefail
          mkdir -p reports data
          STAMP="$(date -u +%Y-%m-%d)"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

          ARGS=(--provider yahoo
                --equity "$ACCOUNT"
                --price-max "$MAX_PRICE"
                --pe-min "$MIN_PE"
                --max-candidates "$MAX_CANDIDATES"
                --save-snapshot data/live-snapshot.json
                --markdown)
          if [ "$REQUIRE_DIVIDEND" = "true" ]; then
            ARGS+=(--require-dividend)
          fi

          echo "Running: deal-desk ${ARGS[*]}"
          if deal-desk "${ARGS[@]}" > "reports/$STAMP.md" 2> reports/run.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "# Deal desk — run failed on $STAMP"
              echo
              echo "The desk could not fetch market data. The most likely cause is"
              echo "Yahoo Finance rate-limiting or blocking GitHub's servers, which"
              echo "happens intermittently and is not a problem with the code."
              echo
              echo "Try re-running this workflow in a few minutes. If it keeps"
              echo "failing, the log below is what to share."
              echo
              echo '```'
              tail -40 reports/run.log || true
              echo '```'
            } > "reports/$STAMP.md"
          fi
          cp "reports/$STAMP.md" reports/latest.md
          cat reports/run.log || true

      - name: Show the report in the run summary
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save the report as a download
        uses: actions/upload-artifact@v4
        with:
          name: deal-desk-report
          path: |
            reports/
            data/live-snapshot.json
          if-no-files-found: warn

      - name: Commit the report back to the repo
        # A plain "commit, push" fails outright if main has moved since this
        # job checked it out -- which happens whenever a run is manually
        # re-run after already having succeeded once (a rerun replays against
        # the ORIGINAL commit the run first saw, not the branch's current
        # tip), or whenever two runs land close enough together to overlap.
        # The concurrency group above stops the second case; this retry loop
        # covers the first: on a rejected push, re-fetch the real tip, replay
        # this run's report commit on top of it (favoring our just-generated
        # files over whatever an older version of them looked like -- there
        # is no "merge" of two market snapshots, only "which one is newer"),
        # and try again.
        run: |
          set -o pipefail
          git config user.name "deal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/live-snapshot.json
          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Deal desk report ${{ steps.desk.outputs.stamp }}"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- main moved since checkout. Replaying on top of the current tip."
            git fetch origin "${{ github.ref_name }}"
            git reset --soft "origin/${{ github.ref_name }}"
            git add reports data/live-snapshot.json
            git commit -m "Deal desk report ${{ steps.desk.outputs.stamp }}"
            sleep $((attempt * 3))
          done

          echo "::error::Could not push the report after 5 attempts -- main kept moving underneath this run."
          exit 1

      - name: Fail the run if the desk itself failed
        if: steps.desk.outputs.ok == 'false'
        run: |
          echo "The desk could not fetch data -- see reports/latest.md" >&2
          exit 1
